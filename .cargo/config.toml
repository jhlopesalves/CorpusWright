[alias]
xtask = "run --package corpuswright-xtask --"

[env]
# Redirect ts-rs #[ts(export)] test output into target/ so `cargo test` does not
# recreate the retired crates/corpuswright-core/bindings/ directory. Canonical
# bindings live in apps/desktop/src/generated/ via `--example export_ts`.
TS_RS_EXPORT_DIR = { value = "target/ts-rs-bindings", relative = true }
