name: Draft alpha release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.label }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows NSIS
            platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            pdfium_platform: windows-x64
            args: --bundles nsis
          - label: macOS Intel DMG
            platform: macos-latest
            rust-targets: x86_64-apple-darwin
            pdfium_platform: macos-x64
            args: --target x86_64-apple-darwin --bundles dmg
          - label: macOS Apple Silicon DMG
            platform: macos-latest
            rust-targets: aarch64-apple-darwin
            pdfium_platform: macos-arm64
            args: --target aarch64-apple-darwin --bundles dmg
          - label: Linux x86_64 Debian
            platform: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            pdfium_platform: linux-x64
            args: --bundles deb

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Derive canonical release tag from release metadata
        id: release_metadata
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./release-metadata.json').version")"
          echo "App version from release-metadata.json: ${APP_VERSION}"

          node -e "
          const v = process.argv[1];
          const semverRe = /^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$/;
          const tagRe    = /^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$/;
          if (!semverRe.test(v)) {
            console.error('FATAL: Version \"' + v + '\" does not match strict alpha semver (required: X.Y.Z-alpha.N)');
            process.exit(1);
          }
          const tag = 'v' + v;
          if (!tagRe.test(tag)) {
            console.error('FATAL: Computed tag \"' + tag + '\" is malformed (required: vX.Y.Z-alpha.N)');
            process.exit(1);
          }
          console.log('release_tag=' + tag);
          console.log('release_name=CorpusWright ' + tag);
          " "${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Computed canonical release tag: v${APP_VERSION}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux build and smoke dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file jq libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf xvfb

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Ensure platform PDFium library
        run: node scripts/fetch-pdfium.cjs "${{ matrix.pdfium_platform }}" --output-dir apps/desktop/src-tauri/resources/ocr

      - name: Check release version consistency
        run: node scripts/check-release-consistency.cjs

      - name: Check PDFium provenance
        run: node scripts/check-pdfium.cjs

      - name: Build dedicated Linux native-smoke package
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles deb --features native-smoke

      - name: Install, exercise, and uninstall Linux native-smoke package
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "${DEB}"
          dpkg-deb --contents "${DEB}" | tee /tmp/corpuswright-deb-contents.txt
          PACKAGE="$(dpkg-deb --field "${DEB}" Package)"
          trap 'sudo apt-get remove -y "${PACKAGE}" || true' EXIT
          cargo xtask generate-fixtures --output /tmp/corpuswright-native-corpus
          sudo apt-get install -y "./${DEB}"
          test -x /usr/bin/corpuswright-desktop
          find /usr/share/applications -maxdepth 1 -iname '*corpuswright*.desktop' -print -quit | grep -q .
          timeout 180s xvfb-run -a env \
            CORPUSWRIGHT_NATIVE_SMOKE_CORPUS=/tmp/corpuswright-native-corpus \
            CORPUSWRIGHT_NATIVE_SMOKE_EXPORT=/tmp/corpuswright-native-export \
            CORPUSWRIGHT_NATIVE_SMOKE_RESULT=/tmp/corpuswright-native-result.json \
            /usr/bin/corpuswright-desktop
          jq -e '.status == "passed" and .evidence.documentsScanned > 0 and .evidence.concordanceHits > 0' \
            /tmp/corpuswright-native-result.json
          sudo apt-get remove -y "${PACKAGE}"
          trap - EXIT
          test ! -e /usr/bin/corpuswright-desktop
          test -z "$(find /usr/share/applications -maxdepth 1 -iname '*corpuswright*.desktop' -print -quit)"
          rm -rf /tmp/corpuswright-native-corpus /tmp/corpuswright-native-export \
            /tmp/corpuswright-native-result.json
          rm -rf target/release/bundle/deb

      - name: Load canonical release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NOTES_PATH="$(node -p "require('./release-metadata.json').releaseNotes")"
          if [ ! -f "${RELEASE_NOTES_PATH}" ]; then
            echo "FATAL: release notes do not exist: ${RELEASE_NOTES_PATH}" >&2
            exit 1
          fi
          {
            echo 'body<<__CORPUSWRIGHT_RELEASE_NOTES__'
            cat "${RELEASE_NOTES_PATH}"
            echo '__CORPUSWRIGHT_RELEASE_NOTES__'
          } >> "${GITHUB_OUTPUT}"

      - name: Build Tauri artifacts and update draft prerelease
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          tagName: ${{ steps.release_metadata.outputs.release_tag }}
          releaseName: ${{ steps.release_metadata.outputs.release_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          releaseCommitish: ${{ github.sha }}
          args: ${{ matrix.args }}
