[package]
name = "corpuswright-core"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
publish = false

[dependencies]
aho-corasick = "1.1.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
encoding_rs = "0.8.35"
lazy_static = "1.5.0"
regex = "1.12.3"
rust-stemmers = "1.2.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
unicode-normalization = "0.1.25"
unicode-segmentation = "=1.13.3"
html2text = "0.13"
zip = "8.6.0"
quick-xml = "0.36.1"
lopdf = "0.41.0"
rayon = { workspace = true }
pdfium-render = "0.9.1"
ocrs = "0.12.2"
rten = "0.24.0"
rten-tensor = "0.24.0"
image = "0.25.10"
ndarray = "0.17.2"
anyhow = "1.0.102"
ts-rs = "10"
lingua = { version = "1", default-features = false, features = ["english", "portuguese", "french"] }
udpipe-rs = "0.2.0"

[dev-dependencies]
corpuswright-test-support = { path = "../corpuswright-test-support" }
tempfile = "3.10"

[build-dependencies]
cc = "1.2"
